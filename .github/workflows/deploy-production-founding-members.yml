name: Deploy NEXORA Production Core, Social Activity and Notification Functions

on:
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: Confirm deployment of core, social activity, notification and GiftVerse functions plus Firestore rules to NEXORA production
        required: true
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-production-founding-members.yml'
      - 'firestore.rules'
      - 'functions/src/index.ts'
      - 'functions/src/giftCatalog.ts'
      - 'functions/src/giftCatalogPolicy.ts'
      - 'functions/src/giftPurchases.ts'
      - 'functions/src/giftDelivery.ts'
      - 'functions/src/giftInventoryTransfers.ts'
      - 'functions/src/giftFriendPurchases.ts'
      - 'functions/src/pushDelivery.ts'
      - 'functions/src/followNotificationDelivery.ts'
      - 'functions/src/liveNotificationDelivery.ts'
      - 'functions/src/messageNotificationDelivery.ts'
      - 'functions/src/commentNotificationPolicy.ts'
      - 'functions/src/postComments.ts'
      - 'functions/src/postEngagement.ts'
      - 'functions/src/postReplies.ts'
      - 'functions/src/postReposts.ts'

permissions:
  contents: read
  id-token: write

concurrency:
  group: nexora-production-functions-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || inputs.confirm_production_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: nexora-production
    env:
      NEXORA_ENV: production
      NODE_ENV: production
      NEXORA_PRODUCTION_PROJECT_ID: nexora-prod-voiceharrison
      GCLOUD_PROJECT: nexora-prod-voiceharrison
      FIRESTORE_DATABASE_ID: default
      FIREBASE_STORAGE_BUCKET: nexora-prod-voiceharrison.appspot.com
      NPM_CONFIG_PRODUCTION: 'false'
    steps:
      - name: Check out reviewed production release
        uses: actions/checkout@v4

      - name: Require the pinned NEXORA production target
        run: |
          test "$NEXORA_PRODUCTION_PROJECT_ID" = "nexora-prod-voiceharrison"
          test "$GCLOUD_PROJECT" = "$NEXORA_PRODUCTION_PROJECT_ID"
          test "$FIRESTORE_DATABASE_ID" = "default"
          test "$FIREBASE_STORAGE_BUCKET" = "nexora-prod-voiceharrison.appspot.com"
          test -n "${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}"
          test -n "${{ secrets.GCP_PRODUCTION_SERVICE_ACCOUNT }}"
      - name: Validate the exact production Firebase target and rules manifest
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const firebase = JSON.parse(fs.readFileSync('firebase.json', 'utf8'));
          const firestore = Array.isArray(firebase.firestore)
            ? firebase.firestore.find((entry) => entry.database === 'default')
            : null;
          if (!firestore || firestore.rules !== 'firestore.rules') {
            throw new Error('firebase.json must deploy firestore.rules to the default Firestore database.');
          }
          if (!fs.existsSync('firestore.rules')) throw new Error('firestore.rules is missing.');
          if (firebase.storage?.rules !== 'storage.rules') throw new Error('firebase.json must deploy storage.rules.');
          console.log(`Validated Firebase project ${process.env.NEXORA_PRODUCTION_PROJECT_ID}, Firestore database ${process.env.FIRESTORE_DATABASE_ID}, rules firestore.rules`);
          NODE

      - name: Authenticate to Google Cloud using production Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PRODUCTION_SERVICE_ACCOUNT }}
          project_id: nexora-prod-voiceharrison

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install and build trusted Firebase Functions
        run: |
          NPM_CONFIG_PRODUCTION=false npm ci --include=dev --prefix functions --no-audit --no-fund
          test -x functions/node_modules/.bin/tsc
          npm --prefix functions run build

      - name: Validate Firestore rules in the emulator
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run test:rules

      - name: Prepare explicit production Functions runtime configuration
        run: |
          printf 'NEXORA_ENV=production\nGCLOUD_PROJECT=%s\nFIRESTORE_DATABASE_ID=%s\nFIREBASE_STORAGE_BUCKET=%s\n' \
            "$NEXORA_PRODUCTION_PROJECT_ID" "$FIRESTORE_DATABASE_ID" "$FIREBASE_STORAGE_BUCKET" \
            > "functions/.env.$NEXORA_PRODUCTION_PROJECT_ID"

      - name: Deploy reviewed core, social activity, notification and GiftVerse Functions with Firestore rules
        run: |
          npx --yes firebase-tools@15.33.0 deploy \
            --only functions:createFoundingMemberAccount,functions:createBetaInviteLink,functions:claimBetaInvite,functions:getGiftCatalog,functions:quoteNexGift,functions:purchaseNexGift,functions:getMyGiftInventory,functions:sendNexGift,functions:transferOwnedNexGift,functions:buyNexGiftForFriend,functions:deliverNotificationPush,functions:deliverFollowInboxNotification,functions:deliverLiveStartNotifications,functions:deliverDirectMessageNotifications,functions:addPublicPostCommentEntry,functions:setPublicPostLike,functions:deletePublicPostCommentEntry,functions:setPublicPostCommentLikeState,functions:replyToPublicPostComment,functions:repostPublicPost,firestore:rules \
            --config firebase.json \
            --project "$NEXORA_PRODUCTION_PROJECT_ID" \
            --non-interactive

      - name: Deploy Storage rules only when the production bucket is provisioned
        run: |
          gcloud storage buckets list --project "$NEXORA_PRODUCTION_PROJECT_ID" --format='value(name)' > /tmp/nexora-storage-buckets.txt
          if grep -Fxq "$FIREBASE_STORAGE_BUCKET" /tmp/nexora-storage-buckets.txt; then
            npx --yes firebase-tools@15.33.0 deploy \
              --only storage \
              --config firebase.json \
              --project "$NEXORA_PRODUCTION_PROJECT_ID" \
              --non-interactive
          else
            echo "::notice::Firebase Storage bucket is not provisioned in the production project; Storage rules were not changed."
          fi

      - name: Record deployment target
        run: |
          echo "## NEXORA production Functions deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "- Project: $NEXORA_PRODUCTION_PROJECT_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Firestore database: $FIRESTORE_DATABASE_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployed callables: createFoundingMemberAccount, createBetaInviteLink, claimBetaInvite, getGiftCatalog, quoteNexGift, purchaseNexGift, getMyGiftInventory, sendNexGift, transferOwnedNexGift, buyNexGiftForFriend" >> "$GITHUB_STEP_SUMMARY"
          echo "- Deployed security rules: Firestore and Storage" >> "$GITHUB_STEP_SUMMARY"
