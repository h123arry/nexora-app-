name: Refresh NEXORA web lockfile

on:
  push:
    branches: [beta-300-anonymous-access]
    paths:
      - 'package.json'

permissions:
  contents: write

jobs:
  lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: beta-300-anonymous-access
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Regenerate lockfile without installing or running scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit lockfile
        run: |
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git commit -m "Align web lockfile with production dependency boundaries"
          git push origin beta-300-anonymous-access
