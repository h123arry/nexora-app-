name: Nexora quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install web dependencies
        run: npm ci --no-audit --no-fund
      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund
      - name: Typecheck web and Functions
        run: npm run lint && npm run functions:build
      - name: Unit tests
        run: npm run test:unit
      - name: Production build
        run: npm run build
      - name: Dependency audit (production packages)
        run: npm audit --omit=dev --audit-level=high
