name: Resolve NEXORA dependency advisories

on:
  push:
    branches: [beta-300-anonymous-access]
    paths:
      - '.github/workflows/resolve-beta-dependency-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-lockfiles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: beta-300-anonymous-access
      - uses: actions/setup-node@v7
        with:
          node-version: 22.23.4
      - name: Apply non-breaking audited dependency updates
        run: |
          npm audit fix --no-fund
          npm --prefix functions audit fix --no-fund
      - name: Verify dependency audits
        run: |
          npm audit --audit-level=high
          npm --prefix functions audit --audit-level=high
      - name: Verify frontend and Functions builds
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund
          npm run lint
          npm run functions:build
          npm run build
      - name: Commit updated lockfiles
        run: |
          if git diff --quiet -- package-lock.json functions/package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          git commit -m "Fix audited dependency vulnerabilities"
          git push origin beta-300-anonymous-access
