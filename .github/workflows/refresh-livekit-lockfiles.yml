name: Refresh LiveKit dependency lockfiles
on:
  push:
    branches: [feat/livekit-video-transport]
    paths:
      - 'package.json'
      - 'functions/package.json'
      - '.github/workflows/refresh-livekit-lockfiles.yml'
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/livekit-video-transport
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm install --prefix functions --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json functions/package-lock.json
          git diff --cached --quiet || git commit -m "chore: refresh LiveKit dependency lockfiles"
          git push
