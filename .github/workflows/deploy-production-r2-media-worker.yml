name: Deploy NEXORA Production R2 Media Worker

on:
  workflow_dispatch:
    inputs:
      confirm_media_worker_deploy:
        description: Deploy the on-demand R2 transcoder to NEXORA production and restore pending R2 media
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

concurrency:
  group: nexora-production-r2-media-worker
  cancel-in-progress: false

jobs:
  deploy:
    if: inputs.confirm_media_worker_deploy == true
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: nexora-production
    env:
      PROJECT_ID: nexora-prod-voiceharrison
      FIRESTORE_DATABASE_ID: default
      R2_BUCKET_NAME: nexora-media
      R2_ACCOUNT_ID: ${{ vars.CLOUDFLARE_R2_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
      GCP_MEDIA_RUNTIME_SERVICE_ACCOUNT: ${{ vars.GCP_PRODUCTION_MEDIA_RUNTIME_SERVICE_ACCOUNT }}
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: srv-dbu403e7bikc73882ivg
    steps:
      - name: Check out reviewed production release
        uses: actions/checkout@v4

      - name: Require production identities and R2 credentials before changing infrastructure
        shell: bash
        run: |
          set -euo pipefail
          test "$PROJECT_ID" = "nexora-prod-voiceharrison"
          test "$FIRESTORE_DATABASE_ID" = "default"
          test -n "$R2_ACCOUNT_ID"
          test -n "$R2_ACCESS_KEY_ID"
          test -n "$R2_SECRET_ACCESS_KEY"
          test -n "$GCP_MEDIA_RUNTIME_SERVICE_ACCOUNT"
          test -n "$RENDER_API_KEY"
          [[ "$GCP_MEDIA_RUNTIME_SERVICE_ACCOUNT" == *@nexora-prod-voiceharrison.iam.gserviceaccount.com ]]
          echo "Production target, Cloudflare R2 credentials, runtime identity and Render API access are present."

      - name: Authenticate to Google Cloud using production Workload Identity Federation
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_PRODUCTION_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PRODUCTION_SERVICE_ACCOUNT }}
          project_id: nexora-prod-voiceharrison

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: nexora-prod-voiceharrison

      - name: Enable required production APIs
        run: |
          gcloud services enable artifactregistry.googleapis.com run.googleapis.com \
            --project "$PROJECT_ID" --quiet

      - name: Verify the media worker runtime identity can access Firestore
        run: |
          gcloud iam service-accounts describe "$GCP_MEDIA_RUNTIME_SERVICE_ACCOUNT" --project "$PROJECT_ID"
          gcloud projects add-iam-policy-binding "$PROJECT_ID" \
            --member="serviceAccount:$GCP_MEDIA_RUNTIME_SERVICE_ACCOUNT" \
            --role="roles/datastore.user" --quiet

      - name: Create the production Artifact Registry repository if needed
        run: |
          if ! gcloud artifacts repositories describe nexora --location=europe-west1 --project="$PROJECT_ID" >/dev/null 2>&1; then
            gcloud artifacts repositories create nexora \
              --repository-format=docker \
              --location=europe-west1 \
              --project="$PROJECT_ID" \
              --description="NEXORA production container images"
          fi
          gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build and push the production media worker image
        run: |
          IMAGE="europe-west1-docker.pkg.dev/$PROJECT_ID/nexora/nexora-media-worker:$GITHUB_SHA"
          docker build -f services/media-worker/Dockerfile -t "$IMAGE" services/media-worker
          docker push "$IMAGE"
          echo "NEXORA_MEDIA_WORKER_IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Generate a private service-to-service token
        shell: bash
        run: |
          TOKEN="$(openssl rand -hex 32)"
          echo "::add-mask::$TOKEN"
          echo "NEXORA_MEDIA_WORKER_TOKEN=$TOKEN" >> "$GITHUB_ENV"

      - name: Deploy the on-demand production R2 transcoder
        run: |
          gcloud run deploy nexora-media-worker \
            --image "$NEXORA_MEDIA_WORKER_IMAGE" \
            --project "$PROJECT_ID" \
            --region europe-west1 \
            --service-account "$GCP_MEDIA_RUNTIME_SERVICE_ACCOUNT" \
            --allow-unauthenticated \
            --ingress all \
            --port 8080 \
            --min 0 \
            --max 3 \
            --memory 4Gi \
            --cpu 2 \
            --concurrency 1 \
            --timeout 900 \
            --set-env-vars "NEXORA_ENV=production,GCLOUD_PROJECT=$PROJECT_ID,GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIRESTORE_DATABASE_ID=$FIRESTORE_DATABASE_ID,R2_ACCOUNT_ID=$R2_ACCOUNT_ID,R2_ACCESS_KEY_ID=$R2_ACCESS_KEY_ID,R2_SECRET_ACCESS_KEY=$R2_SECRET_ACCESS_KEY,R2_BUCKET_NAME=$R2_BUCKET_NAME,MEDIA_WORKER_TOKEN=$NEXORA_MEDIA_WORKER_TOKEN" \
            --quiet
          WORKER_URL="$(gcloud run services describe nexora-media-worker --project "$PROJECT_ID" --region europe-west1 --format='value(status.url)')"
          test -n "$WORKER_URL"
          echo "NEXORA_MEDIA_WORKER_URL=$WORKER_URL" >> "$GITHUB_ENV"

      - name: Verify the worker health endpoint
        run: |
          curl --fail --silent --show-error --retry 12 --retry-delay 5 --retry-all-errors \
            "$NEXORA_MEDIA_WORKER_URL" | tee /tmp/media-worker-health.json
          grep -q '"r2Configured":true' /tmp/media-worker-health.json

      - name: Reconcile and restore existing R2 user-media assets
        run: |
          curl --fail --silent --show-error --max-time 900 \
            --request POST "$NEXORA_MEDIA_WORKER_URL" \
            --header "Authorization: Bearer $NEXORA_MEDIA_WORKER_TOKEN" \
            --header "Content-Type: application/json" \
            --data '{"action":"reconcile"}' | tee /tmp/media-worker-reconcile.json
          echo "## NEXORA R2 media reconciliation" >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/media-worker-reconcile.json >> "$GITHUB_STEP_SUMMARY"

      - name: Connect the Render API to the production media worker
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --request PUT \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/MEDIA_WORKER_URL" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg value "$NEXORA_MEDIA_WORKER_URL" '{value:$value}')"
          curl --fail --silent --show-error --request PUT \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/MEDIA_WORKER_TOKEN" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data "$(jq -n --arg value "$NEXORA_MEDIA_WORKER_TOKEN" '{value:$value}')"
          curl --fail --silent --show-error --request POST \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys" \
            --header "Authorization: Bearer $RENDER_API_KEY" \
            --header "Content-Type: application/json" \
            --data '{"clearCache":"do_not_clear"}'

      - name: Record the production media worker deployment
        run: |
          {
            echo "## NEXORA production R2 media worker"
            echo "- Worker URL: $NEXORA_MEDIA_WORKER_URL"
            echo "- Project: $PROJECT_ID"
            echo "- Firestore database: $FIRESTORE_DATABASE_ID"
            echo "- R2 bucket: $R2_BUCKET_NAME"
            echo "- Scaling: scale-to-zero, maximum three instances"
            echo "- Original media objects are retained."
          } >> "$GITHUB_STEP_SUMMARY"
