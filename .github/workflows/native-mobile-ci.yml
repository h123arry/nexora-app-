name: NEXORA Native and Container CI

on:
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "services/media-worker/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/native-mobile-ci.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "server/**"
      - "tests/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "android/**"
      - "ios/**"
      - "assets/**"
      - "services/media-worker/**"
      - "Dockerfile"
      - ".dockerignore"
      - ".github/workflows/native-mobile-ci.yml"

permissions:
  contents: read

concurrency:
  group: nexora-native-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android debug build and tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install application and Functions dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Type-check application
        run: npm run lint

      - name: Run unit and policy tests
        run: npm run test:unit

      - name: Test staging configuration guardrails
        run: npm run test:staging-config

      - name: Build web application
        run: npm run build:web

      - name: Synchronize Android project
        run: npx cap sync android

      - name: Compile Android debug APK
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Upload unsigned Android debug artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

  ios:
    name: iOS simulator build
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install application and Functions dependencies
        run: |
          npm ci --no-audit --no-fund
          npm ci --prefix functions --no-audit --no-fund

      - name: Type-check application
        run: npm run lint

      - name: Build web application
        run: npm run build:web

      - name: Synchronize iOS project
        run: npx cap sync ios

      - name: Compile unsigned iOS simulator application
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath ios/build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Upload unsigned iOS simulator artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-ios-simulator
          path: ios/build/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: error
          retention-days: 7

  container:
    name: Cloud Run container build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build staging-shaped container with synthetic public Firebase config
        run: |
          docker build -f Dockerfile -t nexora-api:ci \
            --build-arg VITE_NEXORA_ENV=staging \
            --build-arg VITE_API_BASE_URL= \
            --build-arg VITE_FIREBASE_PROJECT_ID=nexora-staging-ci \
            --build-arg VITE_FIREBASE_APP_ID=1:123456:web:ci \
            --build-arg VITE_FIREBASE_API_KEY=ci-public-api-key \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=nexora-staging-ci.firebaseapp.com \
            --build-arg VITE_FIREBASE_DATABASE_ID=default \
            --build-arg VITE_FIREBASE_STORAGE_BUCKET=nexora-staging-ci.firebasestorage.app \
            --build-arg VITE_FIREBASE_MESSAGING_SENDER_ID=123456 \
            --build-arg VITE_FIREBASE_APPCHECK_SITE_KEY=ci-appcheck-site-key \
            .
          npm ci --prefix services/media-worker --no-audit --no-fund
          npm test --prefix services/media-worker
          docker build -f services/media-worker/Dockerfile -t nexora-media-worker:ci services/media-worker
