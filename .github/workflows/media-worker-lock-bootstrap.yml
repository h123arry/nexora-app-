name: Media Worker Lockfile Bootstrap

on:
  push:
    branches:
      - release/objective-1-capacitor-staging-foundation
    paths:
      - services/media-worker/package.json
      - .github/workflows/media-worker-lock-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: nexora-media-worker-lock-bootstrap
  cancel-in-progress: false

jobs:
  lock:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/objective-1-capacitor-staging-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate and verify media worker lockfile
        run: |
          npm install --package-lock-only --prefix services/media-worker --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/media-worker --no-audit --no-fund
          npm test --prefix services/media-worker

      - name: Commit the verified lockfile
        run: |
          rm -f .github/workflows/media-worker-lock-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/media-worker/package-lock.json
          git add -u .github/workflows/media-worker-lock-bootstrap.yml
          git commit -m "Lock media worker production dependencies"
          git push origin HEAD:release/objective-1-capacitor-staging-foundation
