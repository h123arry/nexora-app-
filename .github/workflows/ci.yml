name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexora-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Scan tracked files for secrets
        run: npm run security:scan

      - name: Type-check frontend
        run: npm run lint

      - name: Build trusted Firebase Functions
        run: npm run functions:build

      - name: Run unit tests
        run: npm run test:unit

      - name: Run Firebase Auth regression tests
        run: npm run test:auth

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Run Storage security rules tests
        run: npm run test:storage

      - name: Run migration integration tests
        run: npm run test:migration

      - name: Run engagement integration tests
        run: npm run test:engagement

      - name: Run authenticated API security tests
        run: npm run test:voh-security

      - name: Audit web production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Audit Functions production dependencies
        run: npm --prefix functions audit --omit=dev --audit-level=high

      - name: Build production artifacts
        run: npm run build

      # Keep this strict release-readiness check hard-failing, but run it after
      # independent CI checks so missing owner-verified metadata does not hide them.
      - name: Validate deployment metadata
        run: npm run validate:deployment
