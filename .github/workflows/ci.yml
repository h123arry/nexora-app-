name: Nexora CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: nexora-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            functions/package-lock.json

      - name: Set up Java for Firebase emulators
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          verify-signature: true

      - name: Install web dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Functions dependencies
        run: npm ci --prefix functions --no-audit --no-fund

      - name: Audit Math.random call sites
        run: node scripts/audit-math-random.mjs

      - name: Scan tracked files for secrets
        run: npm run security:scan

      - name: Type-check frontend
        run: npm run lint

      - name: Build trusted Firebase Functions
        run: npm run functions:build

      - name: Validate Cloud Run media worker syntax
        run: node --check services/media-worker/src/index.js

      - name: Run unit tests
        run: npm run test:unit

      - name: Test staging configuration safety gates
        run: npm run test:staging-config

      - name: Run Firebase Auth regression tests
        run: npm run test:auth

      - name: Run Firestore security rules tests
        run: npm run test:rules

      - name: Run Origin account-deletion cleanup tests
        run: npm run test:origin-cleanup

      - name: Run Storage security rules tests
        run: npm run test:storage

      - name: Run migration integration tests
        run: npm run test:migration

      - name: Run engagement integration tests
        run: npm run test:engagement

      - name: Run repost integration tests
        run: npm run test:reposts

      - name: Run comment deletion integration tests
        run: npm run test:comment-deletion

      - name: Run comment reaction integration tests
        run: npm run test:comment-reactions

      - name: Run post reply integration tests
        run: npm run test:post-replies

      - name: Run authenticated API security tests
        run: npm run test:voh-security

      - name: Audit web production dependencies
        run: npm audit --audit-level=high

      - name: Audit Functions production dependencies
        run: npm --prefix functions audit --audit-level=high

      - name: Build production artifacts
        run: npm run build

      # Keep this strict release-readiness check hard-failing, but run it after
      # independent CI checks so missing owner-verified metadata does not hide them.
      - name: Validate deployment metadata
        run: npm run validate:deployment
