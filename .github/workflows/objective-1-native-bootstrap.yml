name: Objective 1 Native Project Bootstrap

on:
  push:
    branches:
      - release/objective-1-capacitor-staging-foundation
    paths:
      - package.json
      - capacitor.config.ts
      - .github/workflows/objective-1-native-bootstrap.yml

permissions:
  contents: write

concurrency:
  group: nexora-objective-1-native-bootstrap
  cancel-in-progress: false

jobs:
  generate-native-projects:
    if: github.ref == 'refs/heads/release/objective-1-capacitor-staging-foundation'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - name: Check out Objective 1 branch
        uses: actions/checkout@v4
        with:
          ref: release/objective-1-capacitor-staging-foundation

      - name: Merge the latest main release work before native generation
        run: |
          git fetch origin main
          if ! git merge --no-edit origin/main; then
            conflicts="$(git diff --name-only --diff-filter=U)"
            if [ "$conflicts" != "package.json" ]; then
              echo "Unexpected merge conflicts: $conflicts"
              exit 1
            fi
            node --input-type=module <<'NODE'
            import { execFileSync } from 'node:child_process';
            import { readFileSync, writeFileSync } from 'node:fs';
            const branchPackage = JSON.parse(execFileSync('git', ['show', 'HEAD:package.json'], { encoding: 'utf8' }));
            const mainPackage = JSON.parse(execFileSync('git', ['show', 'origin/main:package.json'], { encoding: 'utf8' }));
            const merged = {
              ...mainPackage,
              ...branchPackage,
              dependencies: { ...mainPackage.dependencies, ...branchPackage.dependencies },
              devDependencies: { ...mainPackage.devDependencies, ...branchPackage.devDependencies },
              scripts: { ...mainPackage.scripts, ...branchPackage.scripts },
            };
            // Keep main's newest test inventory and add the native API-origin test.
            merged.scripts['test:unit'] = mainPackage.scripts['test:unit'].replace(
              'tests/firebase-environment.test.ts',
              'tests/firebase-environment.test.ts tests/api-base-url.test.ts',
            );
            writeFileSync('package.json', JSON.stringify(merged, null, 2) + '\n');
            NODE
            git add package.json
            git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Merge main into Objective 1 release architecture"
          fi
          git push origin HEAD:release/objective-1-capacitor-staging-foundation

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java for Android Gradle
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate the npm lockfile for pinned Capacitor dependencies
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install exactly the committed dependency graph
        run: npm ci --no-audit --no-fund

      - name: Validate staging guardrails
        run: npm run test:staging-config

      - name: Test native API origin policy
        run: npx tsx --test tests/api-base-url.test.ts

      - name: Build the existing React web application
        run: npm run build:web

      - name: Generate Android project when not already present
        run: if [ ! -d android ]; then npx cap add android; fi

      - name: Generate iOS project when not already present
        run: if [ ! -d ios ]; then npx cap add ios; fi

      - name: Synchronize the existing web application into both native shells
        run: npx cap sync

      - name: Compile Android debug shell
        run: |
          cd android
          ./gradlew --no-daemon assembleDebug

      - name: Compile iOS simulator shell without signing
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -sdk iphonesimulator \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Rebase generated files onto the latest Objective 1 branch
        run: |
          git stash push --include-untracked -m "objective-1 generated native projects"
          git fetch origin release/objective-1-capacitor-staging-foundation
          git rebase origin/release/objective-1-capacitor-staging-foundation
          git stash pop

      - name: Commit generated native projects and lockfile
        run: |
          rm -f .github/workflows/objective-1-native-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json android ios
          git add -u .github/workflows/objective-1-native-bootstrap.yml
          if git diff --cached --quiet; then
            echo "Native projects and lockfile are already committed."
            exit 0
          fi
          git commit -m "Generate Capacitor Android and iOS projects"
          git push origin HEAD:release/objective-1-capacitor-staging-foundation
