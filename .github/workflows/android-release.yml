name: NEXORA Android signed release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: nexora-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate production app configuration and signing secrets
        env:
          NEXORA_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXORA_FIREBASE_APPCHECK_SITE_KEY }}
          NEXORA_FIREBASE_VAPID_KEY: ${{ vars.NEXORA_FIREBASE_VAPID_KEY }}
          KEYSTORE: ${{ secrets.NEXORA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then echo "Missing required GitHub secret: NEXORA_ANDROID_$name"; exit 1; fi
          done
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('firebase-applet-config.json', 'utf8'));
          const expected = {
            projectId: 'nexora-prod-voiceharrison',
            appId: '1:128918144717:web:1bf7a574fddb18bc3e0b84',
            authDomain: 'nexora-prod-voiceharrison.firebaseapp.com',
            firestoreDatabaseId: 'default',
            storageBucket: 'nexora-prod-voiceharrison.firebasestorage.app',
            messagingSenderId: '128918144717',
          };
          for (const [key, value] of Object.entries(expected)) {
            if (config[key] !== value) throw new Error(`Production Firebase config mismatch: ${key}`);
          }
          const env = {
            VITE_FIREBASE_PROJECT_ID: config.projectId,
            VITE_FIREBASE_APP_ID: config.appId,
            VITE_FIREBASE_API_KEY: config.apiKey,
            VITE_FIREBASE_AUTH_DOMAIN: config.authDomain,
            VITE_FIREBASE_DATABASE_ID: config.firestoreDatabaseId,
            VITE_FIREBASE_STORAGE_BUCKET: config.storageBucket,
            VITE_FIREBASE_MESSAGING_SENDER_ID: config.messagingSenderId,
            VITE_FIREBASE_APPCHECK_SITE_KEY: process.env.NEXORA_FIREBASE_APPCHECK_SITE_KEY || '',
            VITE_FIREBASE_VAPID_KEY: process.env.NEXORA_FIREBASE_VAPID_KEY || '',
          };
          for (const [key, value] of Object.entries(env)) {
            if (key !== 'VITE_FIREBASE_APPCHECK_SITE_KEY' && key !== 'VITE_FIREBASE_VAPID_KEY' && !value) {
              throw new Error(`Missing production build value: ${key}`);
            }
            fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value.replace(/%/g, '%25').replace(/\n/g, '%0A').replace(/\r/g, '%0D')}\n`);
          }
          NODE

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXORA_ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nexora-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-signing/nexora-release.jks"
          chmod 600 "$RUNNER_TEMP/nexora-signing/nexora-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/nexora-signing/nexora-release.jks" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Build production web assets
        run: npm run build:web
        env:
          VITE_NEXORA_ENV: production
          VITE_API_BASE_URL: https://nexoraapp.com.ng
          NEXORA_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXORA_FIREBASE_APPCHECK_SITE_KEY }}
          NEXORA_FIREBASE_VAPID_KEY: ${{ vars.NEXORA_FIREBASE_VAPID_KEY }}

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        env:
          NEXORA_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nexora-signing/nexora-release.jks
          NEXORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
          NEXORA_ANDROID_KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
          NEXORA_ANDROID_KEY_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEY_PASSWORD }}
          NEXORA_VERSION_NAME: ${{ github.ref_name }}
          NEXORA_VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          export NEXORA_VERSION_NAME="$VERSION"
          cd android
          ./gradlew --no-daemon clean assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NEXORA-$VERSION.apk"

      - name: Verify APK package identity and release signature
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/NEXORA-${GITHUB_REF_NAME#android-v}.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          PACKAGE_ID="$(apkanalyzer manifest application-id "$APK")"
          test "$PACKAGE_ID" = "com.voiceofharrison.nexora" || (echo "Unexpected APK package ID: $PACKAGE_ID" && exit 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.voiceofharrison.nexora'"
          sha256sum "$APK" > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish APK and checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NEXORA Android ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/NEXORA-${{ github.ref_name }}.apk
            ${{ runner.temp }}/SHA256SUMS.txt
