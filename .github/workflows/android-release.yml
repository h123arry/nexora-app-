name: NEXORA Android signed release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: nexora-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate release signing secrets
        env:
          KEYSTORE: ${{ secrets.NEXORA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE" || (echo "Missing NEXORA_ANDROID_KEYSTORE_BASE64" && exit 1)
          test -n "$STORE_PASSWORD" || (echo "Missing NEXORA_ANDROID_KEYSTORE_PASSWORD" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing NEXORA_ANDROID_KEY_ALIAS" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing NEXORA_ANDROID_KEY_PASSWORD" && exit 1)

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXORA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/nexora-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-signing/nexora-release.jks"
          chmod 600 "$RUNNER_TEMP/nexora-signing/nexora-release.jks"

      - name: Build production web assets
        run: npm run build:web
        env:
          VITE_NEXORA_ENV: production
          VITE_API_BASE_URL: ${{ vars.NEXORA_PRODUCTION_API_BASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.NEXORA_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.NEXORA_FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.NEXORA_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXORA_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.NEXORA_FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXORA_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXORA_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXORA_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.NEXORA_FIREBASE_VAPID_KEY }}

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        env:
          NEXORA_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nexora-signing/nexora-release.jks
          NEXORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
          NEXORA_ANDROID_KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
          NEXORA_ANDROID_KEY_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEY_PASSWORD }}
          NEXORA_VERSION_NAME: ${{ github.ref_name }}
          NEXORA_VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          export NEXORA_VERSION_NAME="$VERSION"
          cd android
          ./gradlew --no-daemon clean assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NEXORA-$VERSION.apk"

      - name: Verify APK package identity and signature
        run: |
          test -s "$RUNNER_TEMP/NEXORA-${GITHUB_REF_NAME#android-v}.apk"
          sha256sum "$RUNNER_TEMP/NEXORA-${GITHUB_REF_NAME#android-v}.apk" > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish APK and checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NEXORA Android ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/NEXORA-${{ github.ref_name }}.apk
            ${{ runner.temp }}/SHA256SUMS.txt
