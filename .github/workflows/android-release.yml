name: NEXORA Android signed release

on:
  push:
    tags:
      - "android-v*"

permissions:
  contents: write

concurrency:
  group: nexora-android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate production app configuration and signing secrets
        env:
          KEYSTORE: ${{ secrets.NEXORA_ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEY_PASSWORD }}
          PROJECT_ID: ${{ vars.NEXORA_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ vars.NEXORA_FIREBASE_APP_ID }}
          API_KEY: ${{ vars.NEXORA_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ vars.NEXORA_FIREBASE_AUTH_DOMAIN }}
          DATABASE_ID: ${{ vars.NEXORA_FIREBASE_DATABASE_ID }}
          STORAGE_BUCKET: ${{ vars.NEXORA_FIREBASE_STORAGE_BUCKET }}
          SENDER_ID: ${{ vars.NEXORA_FIREBASE_MESSAGING_SENDER_ID }}
        run: |
          set -euo pipefail
          for name in KEYSTORE STORE_PASSWORD KEY_ALIAS KEY_PASSWORD PROJECT_ID APP_ID API_KEY AUTH_DOMAIN DATABASE_ID STORAGE_BUCKET SENDER_ID; do
            if [ -z "${!name:-}" ]; then echo "Missing required GitHub secret/variable: $name"; exit 1; fi
          done
          test "$PROJECT_ID" = "nexora-prod-voiceharrison"
          test "$AUTH_DOMAIN" = "nexora-prod-voiceharrison.firebaseapp.com"
          test "$DATABASE_ID" = "default"
          test "$STORAGE_BUCKET" = "nexora-prod-voiceharrison.firebasestorage.app"
          test "$SENDER_ID" = "128918144717"
          case "$APP_ID" in
            1:128918144717:web:*) ;;
            *) echo "NEXORA_FIREBASE_APP_ID is not the registered NEXORA production Web App ID"; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Decode permanent Android signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.NEXORA_ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/nexora-signing"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexora-signing/nexora-release.jks"
          chmod 600 "$RUNNER_TEMP/nexora-signing/nexora-release.jks"
          keytool -list -keystore "$RUNNER_TEMP/nexora-signing/nexora-release.jks" -storepass "${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}" -alias "${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}" >/dev/null

      - name: Build production web assets
        run: npm run build:web
        env:
          VITE_NEXORA_ENV: production
          VITE_API_BASE_URL: ${{ vars.NEXORA_PRODUCTION_API_BASE_URL }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.NEXORA_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.NEXORA_FIREBASE_APP_ID }}
          VITE_FIREBASE_API_KEY: ${{ vars.NEXORA_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.NEXORA_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_DATABASE_ID: ${{ vars.NEXORA_FIREBASE_DATABASE_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.NEXORA_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.NEXORA_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.NEXORA_FIREBASE_APPCHECK_SITE_KEY }}
          VITE_FIREBASE_VAPID_KEY: ${{ vars.NEXORA_FIREBASE_VAPID_KEY }}

      - name: Synchronize Capacitor Android project
        run: npx cap sync android

      - name: Build signed release APK
        env:
          NEXORA_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/nexora-signing/nexora-release.jks
          NEXORA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEYSTORE_PASSWORD }}
          NEXORA_ANDROID_KEY_ALIAS: ${{ secrets.NEXORA_ANDROID_KEY_ALIAS }}
          NEXORA_ANDROID_KEY_PASSWORD: ${{ secrets.NEXORA_ANDROID_KEY_PASSWORD }}
          NEXORA_VERSION_NAME: ${{ github.ref_name }}
          NEXORA_VERSION_CODE: ${{ github.run_number }}
        run: |
          VERSION="${GITHUB_REF_NAME#android-v}"
          export NEXORA_VERSION_NAME="$VERSION"
          cd android
          ./gradlew --no-daemon clean assembleRelease
          mv app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/NEXORA-$VERSION.apk"

      - name: Verify APK package identity and release signature
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/NEXORA-${GITHUB_REF_NAME#android-v}.apk"
          test -s "$APK"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          PACKAGE_ID="$(apkanalyzer manifest application-id "$APK")"
          test "$PACKAGE_ID" = "com.voiceofharrison.nexora" || (echo "Unexpected APK package ID: $PACKAGE_ID" && exit 1)
          "$BUILD_TOOLS/aapt" dump badging "$APK" | grep -F "package: name='com.voiceofharrison.nexora'"
          sha256sum "$APK" > "$RUNNER_TEMP/SHA256SUMS.txt"

      - name: Publish APK and checksum to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NEXORA Android ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/NEXORA-${{ github.ref_name }}.apk
            ${{ runner.temp }}/SHA256SUMS.txt
